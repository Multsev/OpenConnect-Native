name: Build release

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install xcodegen openconnect
      - name: Test release retention
        run: ./Tests/ReleasePipelineTests.sh
      - name: Build self-contained, ad-hoc-signed DMG
        run: ./Scripts/package_dmg.sh development
      - name: Verify release checksum
        run: shasum -a 256 -c Releases/OpenConnect-Native-*.dmg.sha256
      - name: Upload pull-request artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: OpenConnect-Native-DMG
          path: Releases/OpenConnect-Native-*.dmg*
      - name: Publish GitHub release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Releases/OpenConnect-Native-*.dmg Releases/OpenConnect-Native-*.dmg.sha256 --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" Releases/OpenConnect-Native-*.dmg Releases/OpenConnect-Native-*.dmg.sha256 --clobber
      - name: Keep only the two latest GitHub releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./Scripts/prune_releases.sh github 2
