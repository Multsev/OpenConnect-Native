name: CiscoConnect
options:
  bundleIdPrefix: com.max
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "16"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  CiscoConnect:
    type: application
    platform: macOS
    sources:
      - path: Sources/CiscoConnect
        excludes:
          - "Resources"
      - path: App/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.max.ciscoconnect
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/CiscoConnect.entitlements
